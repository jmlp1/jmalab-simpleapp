name: ci-cd

# Golden-path pipeline: build -> SAST (CodeQL) -> dependency/secret scan -> policy gate
# (Bicep what-if against the assigned Azure Policies) -> deploy -> DAST (OWASP ZAP).
# See docs/ARCHITECTURE.md for the diagram this file implements.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  APP_DIR: app/SimpleApp
  RESOURCE_GROUP: rg-jmalabuk-dev-wcus
  APP_SERVICE_NAME: app-jmalabuk-simpleapp
  APP_URL: https://app-jmalabuk-simpleapp.azurewebsites.net

permissions:
  contents: read

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: ${{ env.APP_DIR }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: dotnet build -c Release --no-restore

      - name: Publish
        working-directory: ${{ env.APP_DIR }}
        run: dotnet publish -c Release --no-build -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ${{ env.APP_DIR }}/publish

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    # This repo is a personal private repo, and GitHub Advanced Security (which the Security
    # tab / code scanning alerts require) is org-only — see docs/ROADMAP.md. CodeQL still runs;
    # results are published as a downloadable SARIF artifact instead of a Security-tab alert,
    # and the explicit grep step below is what actually gates the pipeline on error-level
    # findings (upload: never skips GitHub's own severity check along with the upload).
    permissions:
      contents: read
      actions: read # codeql-action needs this to read its own workflow run, even without upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
          upload: never
          output: sarif-results

      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results

      - name: Fail on error-severity CodeQL findings
        run: |
          count=$(jq '[.runs[].results[]? | select(.level=="error")] | length' sarif-results/*.sarif | awk '{s+=$1} END {print s+0}')
          echo "Error-level findings: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL found $count error-severity issue(s) — see the codeql-sarif artifact."
            exit 1
          fi

  dependency-secret-scan:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    # actions/dependency-review-action is deliberately not used here: it requires the
    # Dependency graph / GitHub Advanced Security, which — like CodeQL's Security tab —
    # isn't available on a personal private repo. `dotnet list package --vulnerable` below
    # is the free-tier equivalent and runs on every push and PR.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Known-vulnerable NuGet packages
        working-directory: ${{ env.APP_DIR }}
        run: |
          dotnet restore
          vulnerable=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$vulnerable"
          if echo "$vulnerable" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet package(s) detected — see log above."
            exit 1
          fi

  policy-gate:
    name: Policy gate (Bicep what-if)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep lint
        run: az bicep build --file infra/main.bicep

      - name: What-if against Azure Policy guardrails
        run: |
          az deployment sub what-if \
            --name main-wcus \
            --location westcentralus \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam

  infra-deploy:
    name: Apply infrastructure changes
    needs: policy-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Same environment as the app deploy job below: this is the step that actually applies
    # infra/ changes to the live subscription, so it deserves the same "production" gate.
    # GitHub Environment required-reviewer approval isn't set up yet (that's a Settings toggle,
    # not something expressible here) — worth adding given this now runs on every push to main.
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply infra/ via Bicep
        run: |
          az deployment sub create \
            --name main-wcus \
            --location westcentralus \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam

  deploy:
    name: Deploy to App Service
    needs: [build, codeql, dependency-secret-scan, policy-gate, infra-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-publish
          path: publish

      - name: Zip publish output
        run: (cd publish && zip -r ../deploy.zip .)

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy zip to App Service
        run: |
          az webapp deploy \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_SERVICE_NAME }} \
            --src-path deploy.zip \
            --type zip

      - name: Smoke test /healthz
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}/healthz")
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            echo "attempt $i: got $code, retrying..."
            sleep 10
          done
          echo "::error::App did not report healthy after deploy."
          exit 1

  dast:
    name: DAST (OWASP ZAP baseline)
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # lets the action file/update a tracking issue with each scan's findings
    steps:
      # continue-on-error because the report-artifact upload inside this action has hit a
      # known intermittent GitHub backend issue ("Create Artifact Container failed") that
      # isn't retryable and isn't about our config. The scan's actual findings are already
      # captured either way via the GitHub Issue this action files (allow_issue_writing above),
      # so a red job here would only ever be about that redundant zip, not the real result —
      # check the job summary/linked issue for the real outcome, not just pass/fail colour.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: ${{ env.APP_URL }}
          cmd_options: "-a"
          fail_action: false
